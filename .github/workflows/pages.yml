name: Pages

# Builds the live dashboard in site/ from the extension's own files and recorded fixtures, and publishes it to GitHub Pages.
# The default branch is master (origin/main is stale and must not deploy).
on:
  push:
    branches: [master]
    paths: ['site/**', 'tests/**', 'manifest.json', 'background.js', 'content.js', 'styles.css', 'README.md', 'PRIVACY.md', '*.png', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: node --test tests/*.test.mjs
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
